<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mehboob Ali - Senior AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <g stroke="#2DD4BF" stroke-opacity="0.08" stroke-width="1">
      <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
      <path d="M80 0 V340 M160 0 V340 M240 0 V340 M320 0 V340 M400 0 V340 M480 0 V340 M560 0 V340 M640 0 V340 M720 0 V340 M800 0 V340 M880 0 V340 M960 0 V340 M1040 0 V340 M1120 0 V340"/>
    </g>

    <g fill="none" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="1.5">
      <ellipse cx="960" cy="170" rx="180" ry="110"/>
      <ellipse cx="960" cy="170" rx="130" ry="78"/>
      <ellipse cx="960" cy="170" rx="80" ry="48"/>
    </g>
    <circle cx="960" cy="170" r="18" fill="#2DD4BF" filter="url(#soft)">
      <animate attributeName="r" values="16;22;16" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="1200" height="40" fill="url(#glow)">
      <animate attributeName="y" values="-40;340" dur="5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="8" height="340" fill="url(#neon)"/>

    <text x="56" y="78" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="4">SENIOR AI ENGINEER</text>
    <text x="56" y="160" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700">Mehboob Ali</text>
    <text x="56" y="210" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">models x infrastructure x realtime systems</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect x="56" y="250" rx="10" width="150" height="36" fill="#042F2E" stroke="#2DD4BF" stroke-opacity="0.5"/>
      <text x="76" y="273" fill="#5EEAD4">ONLINE</text>

      <rect x="220" y="250" rx="10" width="210" height="36" fill="#0B1220" stroke="#334155"/>
      <text x="240" y="273" fill="#CBD5E1">Open to Remote</text>

      <rect x="446" y="250" rx="10" width="250" height="36" fill="#0B1220" stroke="#334155"/>
      <text x="466" y="273" fill="#CBD5E1">Karachi, Pakistan</text>
    </g>

    <g fill="#22D3EE">
      <circle cx="820" cy="80" r="4">
        <animate attributeName="cy" values="80;95;80" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="110" r="3">
        <animate attributeName="cy" values="110;90;110" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="260" r="3.5">
        <animate attributeName="cy" values="260;245;260" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
