      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="24" fill="#020617"/>
  <rect x="16" y="16" width="1168" height="228" rx="18" fill="url(#panel)" stroke="#134E4A"/>

  <text x="48" y="56" fill="#5EEAD4" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3">PATH</text>

  <!-- timeline rail -->
