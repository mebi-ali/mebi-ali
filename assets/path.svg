  <text x="748" y="112" fill="#5EEAD4" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">EDUCATION</text>
  <text x="748" y="148" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">B.S. Computer Science</text>
  <text x="748" y="178" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="14">FAST University</text>
