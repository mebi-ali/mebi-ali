  <text x="84" y="188" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Software Engineer @ Xloop</text>
  <text x="84" y="212" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="13">Data Engineer @ Digitized Planet (UK)</text>

