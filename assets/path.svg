  <!-- current -->
  <circle cx="57.5" cy="96" r="6" fill="#2DD4BF"/>
  <text x="84" y="92" fill="#5EEAD4" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1">NOW</text>
  <text x="84" y="116" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Senior AI Engineer</text>
  <text x="84" y="140" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="14">Agentic AI | Voice | Vision | Production backends</text>

