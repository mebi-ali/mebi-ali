<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="24" fill="#020617"/>
  <rect x="16" y="16" width="1168" height="188" rx="18" fill="url(#card)" stroke="#134E4A"/>

  <text x="48" y="58" fill="#5EEAD4" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3">SYSTEM BRIEFING</text>
  <text x="48" y="98" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">I ship AI systems that survive production.</text>
  <text x="48" y="136" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="16">Agentic backends · Voice AI · Computer Vision · FastAPI microservices</text>

  <rect x="48" y="160" width="320" height="2" fill="url(#line)">
    <animate attributeName="width" values="80;720;80" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#CBD5E1">
    <text x="780" y="70">latency  -30%</text>
    <text x="780" y="98">stack    Python / FastAPI</text>
    <text x="780" y="126">mode     Agentic + Multimodal</text>
    <text x="780" y="154">status   Building</text>
  </g>
</svg>
